spec:
  containers:
  - name: sc360
    image: /sc360_app_provider/images/repo/supply_chain_360:latest
    env:
      PORT: "8080"
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m
    readinessProbe:
      port: 8080
      path: /healthcheck
  endpoints:
  - name: sc360
    port: 8080
    public: true
serviceRoles:
- name: sc360_role
  endpoints:
  - sc360
